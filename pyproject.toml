[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-vs-drawing"
version = "0.1.0"
description = "Local photo-vs-drawing classifier with a human-in-the-loop correction loop."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "open_clip_torch>=2.24",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "Pillow>=10",
    "gradio>=6,<7",
    "typer>=0.12",
    "pyyaml>=6",
    "pydantic>=2.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
deepghs = ["dghs-imgutils>=0.19"]
heic = ["pillow-heif>=0.16"]
finetune = ["timm>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
pvd = "pvd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that download or run real models (deselected by default)",
]
